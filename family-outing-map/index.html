    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

    .pin > span { transform: rotate(45deg); font-size: 15px; line-height: 1; }
    .pin.active { transform: rotate(-45deg) scale(1.25); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sheet-up { animation: sheetUp .28s cubic-bezier(.2,.8,.2,1); }

  <script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ───────────────────────── 데이터 ───────────────────────── */

const DEFAULT_CENTER = [37.5465, 126.9970]; // 서울

  { key: 'stroller',  label: '유모차 진입', emoji: '👶', on: 'bg-sky2-50 text-sky2-700 ring-sky2-100',  pin: '#4A86D4' },
  { key: 'pet',       label: '반려견 동반', emoji: '🐶', on: 'bg-sage-50 text-sage-700 ring-sage-100',  pin: '#4E9A6B' },
];

const SAMPLE_PHOTOS = [
  { label: '아늑한 실내', url: 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=800&q=70&auto=format&fit=crop' },
  { label: '창가 자리',   url: 'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=800&q=70&auto=format&fit=crop' },
  { label: '라떼',        url: 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800&q=70&auto=format&fit=crop' },
  { label: '원두 카운터', url: 'https://images.unsplash.com/photo-1445116572660-236099ec97a0?w=800&q=70&auto=format&fit=crop' },
  { label: '테라스',      url: 'https://images.unsplash.com/photo-1559925393-8be0ec4767c8?w=800&q=70&auto=format&fit=crop' },
  { label: '커피 한 잔',  url: 'https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=800&q=70&auto=format&fit=crop' },
];

// 처음 실행 시 보여 줄 예시 기록 (가상의 카페입니다)
const SEED = [
  { id: 's1', name: '숲속 정원 베이커리', address: '서울 성동구 서울숲 인근', date: '2026-09-27', rating: 5,
    photo: SAMPLE_PHOTOS[4].url, memo: '잔디 마당이 넓어서 콩이가 신나게 뛰어놀았어요',
    review: '야외 테라스 전체 반려견 동반 가능. 기저귀 교환대 있는 화장실, 아기 의자 3개. 주말 오전 11시 전에 가면 한산해요.',
    tags: { babyChair: true, stroller: true, pet: true }, lat: 37.5444, lng: 127.0374 },
  { id: 's2', name: '한옥 라떼 하우스', address: '서울 종로구 북촌로', date: '2026-09-14', rating: 4,
    photo: SAMPLE_PHOTOS[1].url, memo: '분위기 최고, 단 입구에 계단 두 칸',
    review: '유모차는 접어서 들어가야 함. 좌식 자리가 있어서 아기가 기어다니기 좋았음.',
    tags: { babyChair: true, stroller: false, pet: false }, lat: 37.5826, lng: 126.9849 },
  { id: 's3', name: '한강뷰 브런치 카페', address: '서울 마포구 망원한강공원 근처', date: '2026-08-30', rating: 4,
    photo: SAMPLE_PHOTOS[0].url, memo: '엘리베이터 있고 통로 넓어요. 산책 후 들르기 딱',
    review: '반려견은 1층 테라스만 가능. 브런치 양 많음, 아기 이유식 데워 주심.',
    tags: { babyChair: true, stroller: true, pet: true }, lat: 37.5559, lng: 126.8954 },
  { id: 's4', name: '로스터리 바이 더 파크', address: '서울 용산구 이촌동', date: '2026-08-16', rating: 3,
    photo: SAMPLE_PHOTOS[3].url, memo: '커피는 맛있는데 아기 의자가 없어요',
    review: '평일 오후 조용함. 유모차 진입은 무난, 자리 간격이 좁은 편.',
    tags: { babyChair: false, stroller: true, pet: false }, lat: 37.5219, lng: 126.9707 },
];

const loadCafes = () => {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return SEED;
};
const todayStr = () => {
  const d = new Date(); const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
};
const fmtDate = (s) => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${y}.${m}.${d}`; };
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const vibrate = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ───────────────────────── 작은 부품 ───────────────────────── */
function Stars({ value, size = 'text-sm' }) {
  return (
    <span className={`${size} tracking-tight`} aria-label={`별점 ${value}점`}>
      {[1, 2, 3, 4, 5].map((n) => (
        <span key={n} className={n <= value ? 'text-honey-500' : 'text-ink-400/30'}>★</span>
      ))}
    </span>
  );
}

function TagBadge({ tag, active, small }) {
  return (
    <span className={`inline-flex items-center gap-1 rounded-full ring-1 ${small ? 'px-2 py-0.5 text-[11px]' : 'px-2.5 py-1 text-xs'} font-semibold
      ${active ? tag.on : 'bg-transparent text-ink-400/70 ring-ink-400/20 line-through decoration-ink-400/40'}`}>
      <span className={active ? '' : 'grayscale opacity-50'}>{tag.emoji}</span>{tag.label}
    </span>
  );
}

function Photo({ src, alt, className }) {
  const [broken, setBroken] = useState(false);
  useEffect(() => setBroken(false), [src]);
  if (!src || broken) {
    return (
      <div className={`${className} bg-gradient-to-br from-coral-100 via-honey-50 to-sage-50 grid place-items-center text-3xl`}>☕</div>
    );
  }
  return <img src={src} alt={alt} loading="lazy" onError={() => setBroken(true)} className={`${className} object-cover`} />;
}

/* ───────────────────────── 지도 ───────────────────────── */
function pinIcon(cafe, active) {
  const color = cafe.tags.pet ? TAGS[2].pin : cafe.tags.stroller ? TAGS[1].pin : '#F97362';
  const emoji = cafe.tags.pet ? '🐶' : cafe.tags.stroller ? '👶' : '☕';
  return L.divIcon({
    className: '',
    html: `<div class="pin ${active ? 'active' : ''}" style="background:${color}"><span>${emoji}</span></div>`,
    iconSize: [34, 34], iconAnchor: [17, 34],
  });
}

function CafeMap({ cafes, selectedId, onSelect, mapRef }) {
  const elRef = useRef(null);
  const markersRef = useRef({});

  useEffect(() => {
    const map = L.map(elRef.current, { zoomControl: false, attributionControl: true }).setView(DEFAULT_CENTER, 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap',
    }).addTo(map);
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 50);
    return () => map.remove();
  }, []);

  // 마커 갱신
  useEffect(() => {
    const map = mapRef.current; if (!map) return;
    Object.values(markersRef.current).forEach((m) => m.remove());
    markersRef.current = {};
    cafes.forEach((c) => {
      if (c.lat == null || c.lng == null) return;
      const m = L.marker([c.lat, c.lng], { icon: pinIcon(c, c.id === selectedId) })
        .addTo(map).on('click', () => onSelect(c.id, 'map'));
      markersRef.current[c.id] = m;
    });
    const pts = cafes.filter((c) => c.lat != null).map((c) => [c.lat, c.lng]);
    if (!selectedId && pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 14 });
  }, [cafes]);

  // 선택 강조
  useEffect(() => {
    Object.entries(markersRef.current).forEach(([id, m]) => {
      const c = cafes.find((x) => x.id === id); if (c) m.setIcon(pinIcon(c, id === selectedId));
    });
    const c = cafes.find((x) => x.id === selectedId);
    if (c && c.lat != null && mapRef.current) mapRef.current.flyTo([c.lat, c.lng], Math.max(mapRef.current.getZoom(), 14), { duration: 0.6 });
  }, [selectedId]);

  return <div ref={elRef} className="absolute inset-0 z-0" />;
}

function LocationPicker({ value, onChange, center }) {
  const elRef = useRef(null); const mapRef = useRef(null); const markerRef = useRef(null);
  const [locating, setLocating] = useState(false);

  const place = (latlng) => {
    const map = mapRef.current;
    if (!markerRef.current) {
      markerRef.current = L.marker(latlng, { icon: pinIcon({ tags: {} }, true), draggable: true }).addTo(map);
      markerRef.current.on('dragend', (e) => { const p = e.target.getLatLng(); onChange({ lat: p.lat, lng: p.lng }); });
    } else markerRef.current.setLatLng(latlng);
  };

  useEffect(() => {
    const start = value ? [value.lat, value.lng] : center;
    const map = L.map(elRef.current, { zoomControl: false, attributionControl: false }).setView(start, 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    mapRef.current = map;
    if (value) place(start);
    map.on('click', (e) => { place(e.latlng); onChange({ lat: e.latlng.lat, lng: e.latlng.lng }); vibrate(); });
    setTimeout(() => map.invalidateSize(), 300);
    return () => map.remove();
  }, []);

  const useMyLocation = () => {
    if (!navigator.geolocation) return alert('이 기기에서는 위치를 가져올 수 없어요.');
    setLocating(true);
    navigator.geolocation.getCurrentPosition(
      (p) => {
        const ll = { lat: p.coords.latitude, lng: p.coords.longitude };
        mapRef.current.setView([ll.lat, ll.lng], 16); place([ll.lat, ll.lng]); onChange(ll); setLocating(false);
      },
      () => { setLocating(false); alert('위치 권한을 허용하면 현재 위치로 핀을 꽂을 수 있어요.'); },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  };

  return (
    <div className="relative h-44 rounded-2xl overflow-hidden ring-1 ring-ink-400/20">
      <div ref={elRef} className="absolute inset-0" />
      <div className="absolute left-2 top-2 z-[400] rounded-full bg-white/95 px-2.5 py-1 text-[11px] font-semibold text-ink-700 shadow">
        {value ? '📍 핀을 끌어서 조정할 수 있어요' : '지도를 탭해서 위치를 찍어 주세요'}
      </div>
      <button type="button" onClick={useMyLocation}
        className="absolute right-2 bottom-2 z-[400] rounded-full bg-white px-3 py-1.5 text-xs font-bold text-coral-600 shadow active:scale-95">
        {locating ? '찾는 중…' : '◎ 현재 위치'}
      </button>
    </div>
  );
}

/* ───────────────────────── 카드 ───────────────────────── */

/* ───────────────────────── 상세 시트 ───────────────────────── */

        <div className="relative">

          <button onClick={onClose} aria-label="닫기"
            className="absolute right-3 top-3 h-9 w-9 rounded-full bg-black/40 text-white text-lg backdrop-blur active:scale-95">✕</button>
          <div className="absolute left-1/2 top-2 h-1.5 w-10 -translate-x-1/2 rounded-full bg-white/80" />
        </div>
        <div className="space-y-4 p-5">
          <div>
            <h2 className="text-xl font-extrabold text-ink-900">{cafe.name}</h2>
            <p className="mt-1 text-sm text-ink-500">📍 {cafe.address || '주소 미입력'} · {fmtDate(cafe.date)} 방문</p>
            <div className="mt-2 flex items-center gap-2"><Stars value={cafe.rating} size="text-lg" /><b className="text-ink-700">{cafe.rating}.0</b></div>

          <div className="flex flex-wrap gap-1.5">{TAGS.map((t) => <TagBadge key={t.key} tag={t} active={!!cafe.tags[t.key]} />)}</div>

          </div>
          <div className="flex gap-2 pt-1">
            <button onClick={onEdit} className="flex-1 rounded-2xl bg-white py-3 text-sm font-bold text-ink-700 ring-1 ring-ink-400/20 active:scale-95">✏️ 수정</button>
            <button onClick={() => { if (confirm(`'${cafe.name}' 기록을 삭제할까요?`)) onDelete(cafe.id); }}

          </div>
        </div>
      </div>
    </div>

}

/* ───────────────────────── 기록 추가/수정 폼 ───────────────────────── */
function resizeImage(file, max = 900) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject; img.src = reader.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

function AddCafeSheet({ initial, center, onClose, onSave }) {
  const [f, setF] = useState(() => initial || {
    name: '', address: '', date: todayStr(), rating: 0, photo: SAMPLE_PHOTOS[0].url, memo: '', review: '',
    tags: { babyChair: false, stroller: false, pet: false }, lat: null, lng: null,
  });
  const [photoMode, setPhotoMode] = useState(initial && !SAMPLE_PHOTOS.some((p) => p.url === initial.photo) ? 'url' : 'sample');
  const [err, setErr] = useState('');
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const toggleTag = (k) => { vibrate(); setF((p) => ({ ...p, tags: { ...p.tags, [k]: !p.tags[k] } })); };

  const onFile = async (e) => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    try { set('photo', await resizeImage(file)); setPhotoMode('upload'); } catch { alert('사진을 불러오지 못했어요.'); }
  };

  const submit = (e) => {
    e.preventDefault();
    if (!f.name.trim()) return setErr('카페 이름을 입력해 주세요.');
    if (!f.rating) return setErr('별점을 골라 주세요.');
    if (f.lat == null) return setErr('지도에서 위치를 찍어 주세요.');
    vibrate(15);
    onSave({ ...f, name: f.name.trim(), id: f.id || `c${Date.now()}` });
  };

  const label = 'mb-1.5 block text-[13px] font-bold text-ink-700';
  const input = 'w-full rounded-2xl bg-white px-4 py-3 text-ink-900 ring-1 ring-ink-400/20 outline-none focus:ring-2 focus:ring-coral-400 placeholder:text-ink-400/70';

  return (
    <div className="fixed inset-0 z-[1000] fade-in">
      <div className="absolute inset-0 bg-ink-900/40" onClick={onClose} />
      <form onSubmit={submit}
        className="absolute inset-x-0 bottom-0 flex max-h-[94dvh] flex-col rounded-t-[28px] bg-cream sheet-up">
        <div className="flex items-center justify-between border-b border-ink-400/10 px-5 py-4">
          <button type="button" onClick={onClose} className="text-sm font-semibold text-ink-500">취소</button>
          <h2 className="text-base font-extrabold">{initial ? '기록 수정' : '방문 기록 추가'}</h2>
          <button type="submit" className="text-sm font-extrabold text-coral-600">저장</button>
        </div>

        <div className="flex-1 space-y-5 overflow-y-auto no-scrollbar px-5 py-5">
          <div>
            <label className={label}>카페 이름 *</label>
            <input className={input} value={f.name} onChange={(e) => set('name', e.target.value)} placeholder="예) 숲속 정원 베이커리" />
          </div>
          <div>
            <label className={label}>주소</label>
            <input className={input} value={f.address} onChange={(e) => set('address', e.target.value)} placeholder="예) 서울 성동구 서울숲길 00" />
          </div>
          <div>
            <label className={label}>지도 위치 *</label>
            <LocationPicker value={f.lat != null ? { lat: f.lat, lng: f.lng } : null} center={center}
              onChange={(ll) => setF((p) => ({ ...p, ...ll }))} />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className={label}>방문 날짜</label>
              <input type="date" className={input} value={f.date} max={todayStr()} onChange={(e) => set('date', e.target.value)} />
            </div>
            <div>
              <label className={label}>별점 *</label>
              <div className="flex h-[50px] items-center justify-between rounded-2xl bg-white px-2 ring-1 ring-ink-400/20">
                {[1, 2, 3, 4, 5].map((n) => (
                  <button type="button" key={n} onClick={() => { vibrate(); set('rating', n); }} aria-label={`${n}점`}
                    className={`text-[26px] leading-none transition active:scale-125 ${n <= f.rating ? 'text-honey-500' : 'text-ink-400/25'}`}>★</button>
                ))}
              </div>
            </div>
          </div>

          <div>
            <label className={label}>우리 가족 체크리스트</label>
            <div className="grid grid-cols-3 gap-2">
              {TAGS.map((t) => {
                const on = !!f.tags[t.key];
                return (
                  <button type="button" key={t.key} onClick={() => toggleTag(t.key)} aria-pressed={on}
                    className={`relative flex flex-col items-center gap-1 rounded-2xl py-3 text-[12px] font-bold ring-1 transition active:scale-95
                      ${on ? t.on + ' ring-2' : 'bg-white text-ink-500 ring-ink-400/20'}`}>
                    <span className={`absolute right-2 top-2 grid h-4 w-4 place-items-center rounded-[5px] text-[10px] text-white
                      ${on ? 'bg-current' : 'ring-1 ring-ink-400/40'}`}>{on && <span className="text-white">✓</span>}</span>
                    <span className="text-2xl">{t.emoji}</span>{t.label}
                  </button>
                );
              })}
            </div>
          </div>

          <div>
            <label className={label}>사진</label>
            <div className="mb-2 flex rounded-full bg-white p-1 ring-1 ring-ink-400/15 text-[13px] font-bold">
              {[['sample', '샘플'], ['upload', '내 사진'], ['url', 'URL']].map(([k, l]) => (
                <button type="button" key={k} onClick={() => setPhotoMode(k)}
                  className={`flex-1 rounded-full py-1.5 ${photoMode === k ? 'bg-coral-500 text-white' : 'text-ink-500'}`}>{l}</button>
              ))}
            </div>
            {photoMode === 'sample' && (
              <div className="grid grid-cols-3 gap-2">
                {SAMPLE_PHOTOS.map((p) => (
                  <button type="button" key={p.url} onClick={() => set('photo', p.url)}
                    className={`relative overflow-hidden rounded-xl ${f.photo === p.url ? 'ring-[3px] ring-coral-500' : ''}`}>
                    <Photo src={p.url} alt={p.label} className="h-20 w-full" />
                    <span className="absolute inset-x-0 bottom-0 bg-black/40 py-0.5 text-[10px] font-semibold text-white">{p.label}</span>
                  </button>
                ))}
              </div>
            )}
            {photoMode === 'upload' && (
              <label className="flex cursor-pointer items-center gap-3 rounded-2xl bg-white p-3 ring-1 ring-dashed ring-ink-400/30">
                <Photo src={f.photo && f.photo.startsWith('data:') ? f.photo : null} alt="" className="h-16 w-16 rounded-xl" />
                <span className="text-sm font-semibold text-ink-700">📷 앨범에서 고르거나 촬영하기</span>
                <input type="file" accept="image/*" className="hidden" onChange={onFile} />
              </label>
            )}
            {photoMode === 'url' && (
              <div className="flex gap-2">
                <input className={input} inputMode="url" value={f.photo && !f.photo.startsWith('data:') ? f.photo : ''}
                  onChange={(e) => set('photo', e.target.value)} placeholder="https://…" />
                <Photo src={f.photo} alt="" className="h-[50px] w-[50px] shrink-0 rounded-xl" />
              </div>
            )}
          </div>

          <div>
            <label className={label}>한 줄 메모</label>
            <input className={input} maxLength={40} value={f.memo} onChange={(e) => set('memo', e.target.value)} placeholder="카드에 보일 한 줄 (40자)" />
          </div>
          <div>
            <label className={label}>후기</label>
            <textarea className={input + ' min-h-[96px] resize-none'} value={f.review} onChange={(e) => set('review', e.target.value)}
              placeholder="수유실, 기저귀 교환대, 주차, 반려견 동반 구역 등" />
          </div>
          {err && <p className="rounded-xl bg-coral-50 px-3 py-2 text-sm font-semibold text-coral-700">{err}</p>}
        </div>

        <div className="border-t border-ink-400/10 bg-cream px-5 pt-3 pb-safe">
          <button type="submit" className="mb-3 w-full rounded-2xl bg-coral-500 py-4 text-base font-extrabold text-white shadow-lg shadow-coral-500/30 active:scale-[.98]">
            {initial ? '수정 완료' : '기록 저장하기'}
          </button>
        </div>
      </form>
    </div>
  );
}

/* ───────────────────────── 설치 안내 ───────────────────────── */
function InstallGuide({ onClose, deferredPrompt, onInstalled }) {
  const ios = isIOS();
  const install = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') onInstalled();
  };
  const Step = ({ n, children }) => (
    <li className="flex items-start gap-3">
      <span className="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-coral-500 text-sm font-extrabold text-white">{n}</span>
      <span className="pt-0.5 text-[15px] text-ink-700">{children}</span>
    </li>
  );
  return (
    <div className="fixed inset-0 z-[1100] fade-in">
      <div className="absolute inset-0 bg-ink-900/40" onClick={onClose} />
      <div className="absolute inset-x-0 bottom-0 rounded-t-[28px] bg-cream p-6 sheet-up pb-safe">
        <div className="mb-4 flex items-center gap-3">
          <img src="icons/icon-192.png" alt="" className="h-14 w-14 rounded-2xl shadow" />
          <div>
            <h2 className="text-lg font-extrabold">홈 화면에 앱으로 추가</h2>
            <p className="text-sm text-ink-500">주소창 없이 전체 화면으로, 오프라인에서도 열려요</p>
          </div>
        </div>
        {deferredPrompt ? (
          <button onClick={install} className="mb-3 w-full rounded-2xl bg-coral-500 py-4 font-extrabold text-white active:scale-[.98]">지금 설치하기</button>
        ) : ios ? (
          <ol className="mb-4 space-y-3">
            <Step n="1"><b>Safari</b>에서 열어 주세요 (카톡·인스타 내부 브라우저에선 안 돼요)</Step>
            <Step n="2">아래쪽 <b>공유 버튼</b> <span className="inline-block rounded-md bg-white px-1.5 ring-1 ring-ink-400/20">⬆︎</span> 을 눌러요</Step>
            <Step n="3">목록을 내려서 <b>‘홈 화면에 추가’</b> → <b>추가</b></Step>
          </ol>
        ) : (
          <ol className="mb-4 space-y-3">
            <Step n="1"><b>Chrome / 삼성 인터넷</b>에서 열어 주세요</Step>
            <Step n="2">오른쪽 위(삼성은 아래) <b>⋮ 메뉴</b>를 눌러요</Step>
            <Step n="3"><b>‘홈 화면에 추가’</b> 또는 <b>‘앱 설치’</b>를 선택해요</Step>
          </ol>
        )}
        <button onClick={onClose} className="w-full rounded-2xl bg-white py-3.5 text-sm font-bold text-ink-500 ring-1 ring-ink-400/20 mb-3">나중에</button>
      </div>
    </div>
  );
}

/* ───────────────────────── 앱 ───────────────────────── */
function App() {
  const [cafes, setCafes] = useState(loadCafes);
  const [filters, setFilters] = useState({ pet: false, stroller: false, babyChair: false });
  const [selectedId, setSelectedId] = useState(null);
  const [detailId, setDetailId] = useState(null);
  const [editing, setEditing] = useState(null);   // null | 'new' | cafe
  const [mapOpen, setMapOpen] = useState(true);
  const [toast, setToast] = useState('');
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [showInstall, setShowInstall] = useState(false);
  const [standalone, setStandalone] = useState(isStandalone());
  const mapRef = useRef(null);
  const listRef = useRef(null);

  useEffect(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cafes)); } catch (e) { flash('저장 공간이 부족해요. 사진 용량을 줄여 주세요.'); } }, [cafes]);

  // 설치 프롬프트(안드로이드/크롬) + 첫 방문 안내
  useEffect(() => {
    const onPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); };
    const onInstalled = () => { setStandalone(true); setShowInstall(false); flash('홈 화면에 설치됐어요! 🎉'); };
    window.addEventListener('beforeinstallprompt', onPrompt);
    window.addEventListener('appinstalled', onInstalled);
    let dismissed = false; try { dismissed = localStorage.getItem('install-dismissed') === '1'; } catch (e) {}
    const t = !isStandalone() && !dismissed ? setTimeout(() => setShowInstall(true), 1800) : null;
    return () => { window.removeEventListener('beforeinstallprompt', onPrompt); window.removeEventListener('appinstalled', onInstalled); clearTimeout(t); };
  }, []);

  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2200); };

  const visible = useMemo(() =>
    cafes
      .filter((c) => Object.entries(filters).every(([k, on]) => !on || c.tags[k]))
      .sort((a, b) => (b.date || '').localeCompare(a.date || '')),
  [cafes, filters]);

  useEffect(() => { if (selectedId && !visible.some((c) => c.id === selectedId)) setSelectedId(null); }, [visible]);
  useEffect(() => { if (mapRef.current) setTimeout(() => mapRef.current.invalidateSize(), 320); }, [mapOpen]);

  const select = useCallback((id, from) => {
    vibrate(); setSelectedId(id);
    if (from === 'map') {
      const el = document.getElementById(`card-${id}`);
      el && el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }, []);

  const onCardClick = (id) => { if (selectedId === id) setDetailId(id); else select(id, 'list'); if (!mapOpen) setDetailId(id); };

  const save = (cafe) => {
    setCafes((prev) => prev.some((c) => c.id === cafe.id) ? prev.map((c) => c.id === cafe.id ? cafe : c) : [cafe, ...prev]);
    const wasNew = editing === 'new';
    setEditing(null); setDetailId(null);
    setFilters({ pet: false, stroller: false, babyChair: false });
    setTimeout(() => select(cafe.id, 'map'), 50);
    flash(wasNew ? '새 기록을 저장했어요 ☕' : '수정했어요');
  };
  const remove = (id) => { setCafes((p) => p.filter((c) => c.id !== id)); setDetailId(null); setSelectedId(null); flash('삭제했어요'); };

  const toggleFilter = (k) => { vibrate(); setFilters((p) => ({ ...p, [k]: !p[k] })); setSelectedId(null); };
  const detail = cafes.find((c) => c.id === detailId);
  const center = mapRef.current ? [mapRef.current.getCenter().lat, mapRef.current.getCenter().lng] : DEFAULT_CENTER;
  const petCount = cafes.filter((c) => c.tags.pet).length;

  return (
    <div className="mx-auto flex h-[100dvh] max-w-md flex-col bg-cream overflow-hidden">
      {/* 헤더 */}
      <header className="z-20 bg-cream/95 backdrop-blur pt-safe">
        <div className="flex items-center justify-between px-5 pt-3 pb-2">
          <div>
            <p className="text-[12px] font-semibold text-ink-400">👶 아기랑 · 🐶 콩이랑</p>
            <h1 className="text-[22px] font-extrabold tracking-tight text-ink-900">우리가족 나들이 지도</h1>
          </div>
          {!standalone && (
            <button onClick={() => setShowInstall(true)}
              className="rounded-full bg-coral-50 px-3 py-2 text-[12px] font-bold text-coral-600 ring-1 ring-coral-100 active:scale-95">📲 앱 설치</button>
          )}
        </div>
        <div className="flex gap-2 overflow-x-auto no-scrollbar px-5 pb-3">
          {[
            { k: 'pet', l: '🐶 반려견 동반만', c: 'bg-sage-500' },
            { k: 'stroller', l: '👶 유모차 가능만', c: 'bg-sky2-500' },
            { k: 'babyChair', l: '🪑 아기 의자', c: 'bg-honey-500' },
          ].map(({ k, l, c }) => (
            <button key={k} onClick={() => toggleFilter(k)} aria-pressed={filters[k]}
              className={`shrink-0 rounded-full px-3.5 py-2 text-[13px] font-bold transition active:scale-95
                ${filters[k] ? `${c} text-white shadow-md` : 'bg-white text-ink-700 ring-1 ring-ink-400/20'}`}>
              {l}
            </button>
          ))}
        </div>
      </header>

      {/* 지도 */}
      <section className={`relative shrink-0 transition-[height] duration-300 ${mapOpen ? 'h-[38dvh]' : 'h-0'}`}>
        <CafeMap cafes={visible} selectedId={selectedId} onSelect={select} mapRef={mapRef} />
        <div className="pointer-events-none absolute inset-x-0 bottom-0 h-6 bg-gradient-to-t from-cream to-transparent z-[400]" />
      </section>

      {/* 리스트 */}
      <section className="relative z-10 -mt-3 flex min-h-0 flex-1 flex-col rounded-t-[26px] bg-cream">
        <button onClick={() => setMapOpen((v) => !v)} className="flex w-full flex-col items-center pt-2 pb-1">
          <span className="h-1.5 w-10 rounded-full bg-ink-400/30" />
        </button>
        <div className="flex items-baseline justify-between px-5 pb-2">
          <h2 className="text-[15px] font-extrabold text-ink-900">
            저장한 곳 <span className="text-coral-500">{visible.length}</span>
            {visible.length !== cafes.length && <span className="text-ink-400 font-semibold"> / {cafes.length}</span>}
          </h2>
          <button onClick={() => setMapOpen((v) => !v)} className="text-[12px] font-bold text-ink-500">
            {mapOpen ? '지도 접기 ▴' : '지도 펼치기 ▾'}
          </button>
        </div>
        <div ref={listRef} className="flex-1 space-y-3 overflow-y-auto no-scrollbar px-4 pb-32">
          {visible.map((c) => (
            <CafeCard key={c.id} cafe={c} active={c.id === selectedId} onClick={() => onCardClick(c.id)} />
          ))}
          {visible.length === 0 && (
            <div className="mt-8 flex flex-col items-center text-center text-ink-500">
              <span className="text-5xl">🗺️</span>
              <p className="mt-3 font-bold text-ink-700">조건에 맞는 곳이 아직 없어요</p>
              <p className="text-sm">필터를 풀거나 새 장소를 기록해 보세요</p>
            </div>
          )}
          {visible.length > 0 && (
            <p className="pt-2 text-center text-[12px] text-ink-400">카드를 한 번 더 누르면 상세 정보가 열려요 · 반려견 OK {petCount}곳</p>
          )}
        </div>
      </section>

      {/* 추가 버튼 */}
      <button onClick={() => { vibrate(); setEditing('new'); }}
        className="fixed bottom-safe left-1/2 z-30 flex -translate-x-1/2 items-center gap-2 rounded-full bg-coral-500 px-6 py-4 text-[15px] font-extrabold text-white shadow-xl shadow-coral-500/40 active:scale-95">
        <span className="text-xl leading-none">＋</span> 방문 기록
      </button>

      {toast && (
        <div className="fixed left-1/2 top-[calc(env(safe-area-inset-top)+12px)] z-[1200] -translate-x-1/2 rounded-full bg-ink-900/90 px-4 py-2.5 text-sm font-semibold text-white shadow-lg fade-in">{toast}</div>
      )}

      {detail && <DetailSheet cafe={detail} onClose={() => setDetailId(null)} onDelete={remove} onEdit={() => { setEditing(detail); setDetailId(null); }} />}
      {editing && <AddCafeSheet initial={editing === 'new' ? null : editing} center={center} onClose={() => setEditing(null)} onSave={save} />}
      {showInstall && (
        <InstallGuide deferredPrompt={deferredPrompt}
          onInstalled={() => setShowInstall(false)}
          onClose={() => { setShowInstall(false); try { localStorage.setItem('install-dismissed', '1'); } catch (e) {} }} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// 서비스 워커 등록 (https 또는 localhost에서만 동작)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const reg = () => navigator.serviceWorker.register('./sw.js').catch(() => {});
  document.readyState === 'complete' ? reg() : window.addEventListener('load', reg);
}
  </script>
