async function naverSearch(q) {
  const r = await fetch(`api/search?q=${encodeURIComponent(q)}`);
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.message || '검색에 실패했어요.'); err.code = j.error || r.status; throw err; }
  return j.items || [];
}

async function naverImages(q) {
  const r = await fetch(`api/search?type=image&q=${encodeURIComponent(q)}`);
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.message || '사진을 찾지 못했어요.'); err.code = j.error || r.status; throw err; }
  return j.items || [];
}

function reverseArea(lat, lng) {
  return new Promise((resolve) => {
    try {
      const S = window.naver && naver.maps.Service;
      if (!S || !S.reverseGeocode) return resolve('');
      S.reverseGeocode({ coords: new naver.maps.LatLng(lat, lng), orders: S.OrderType.LEGAL_CODE }, (status, res) => {
        if (status !== S.Status.OK) return resolve('');
        const r = res.v2 && res.v2.results && res.v2.results[0];
        resolve(r ? (r.region.area3.name || r.region.area2.name || '') : '');
      });
      setTimeout(() => resolve(''), 3000);
    } catch (e) { resolve(''); }
  });
}

/* ───────────────────────── 지도 엔진 어댑터 (네이버 / 대체 지도) ───────────────────────── */
function makeAdapter(engine, el, { center, zoom, onMapClick }) {
  if (engine === 'naver') {
    const N = naver.maps;
    const map = new N.Map(el, {
      center: new N.LatLng(center[0], center[1]), zoom,
      zoomControl: false, scaleControl: false, mapDataControl: false,
      logoControlOptions: { position: N.Position.BOTTOM_LEFT },
    });
    let markers = [];
    if (onMapClick) N.Event.addListener(map, 'click', (e) => onMapClick(e.coord.lat(), e.coord.lng()));
    return {
      setMarkers(items) {
        markers.forEach((m) => m.setMap(null));
        markers = items.map((it) => {
          const m = new N.Marker({
            position: new N.LatLng(it.lat, it.lng), map, zIndex: it.z || 10,
            icon: { content: it.html, size: new N.Size(it.w, it.h), anchor: new N.Point(it.ax, it.ay) },
          });
          if (it.onClick) N.Event.addListener(m, 'click', it.onClick);
          return m;
        });
      },
      focus(lat, lng, z) { map.morph(new N.LatLng(lat, lng), z || Math.max(map.getZoom(), 15)); },
      fit(points) {
        if (!points.length) return;
        if (points.length === 1) { map.setCenter(new N.LatLng(points[0][0], points[0][1])); map.setZoom(15); return; }
        const b = new N.LatLngBounds(new N.LatLng(points[0][0], points[0][1]), new N.LatLng(points[0][0], points[0][1]));
        points.forEach((p) => b.extend(new N.LatLng(p[0], p[1])));
        map.fitBounds(b, { top: 70, right: 40, bottom: 40, left: 40 });
      },
      center() { const c = map.getCenter(); return [c.lat(), c.lng()]; },
      // 네이버 지도는 처음 크기를 기억하므로, 화면 크기가 바뀌면 직접 다시 알려줌
      resize() {
        try {
          if (el.clientWidth && el.clientHeight) map.setSize(new N.Size(el.clientWidth, el.clientHeight));
          if (map.autoResize) map.autoResize();
        } catch (e) {}
      },
      // 실제로 지도 그림(타일)이 그려졌는지
      drawn() {
        const big = [...el.querySelectorAll('img')].some((i) => i.complete && i.naturalWidth >= 200);
        const cv = [...el.querySelectorAll('canvas')].some((c) => c.width >= 200);
        return big || cv;
      },
      destroy() { try { map.destroy(); } catch (e) {} },
    };
  }
  // 대체 지도 (네이버 키 설정 전 / 인증 실패 시)
  const map = L.map(el, { zoomControl: false }).setView(center, zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  let markers = [];
  if (onMapClick) map.on('click', (e) => onMapClick(e.latlng.lat, e.latlng.lng));
  return {
    setMarkers(items) {
      markers.forEach((m) => m.remove());
      markers = items.map((it) => {
        const m = L.marker([it.lat, it.lng], {
          icon: L.divIcon({ className: '', html: it.html, iconSize: [it.w, it.h], iconAnchor: [it.ax, it.ay] }),
          zIndexOffset: (it.z || 10) * 10,
        }).addTo(map);
        if (it.onClick) m.on('click', it.onClick);
        return m;
      });
    },
    focus(lat, lng, z) { map.flyTo([lat, lng], z || Math.max(map.getZoom(), 15), { duration: 0.6 }); },
    fit(points) {
      if (!points.length) return;
      if (points.length === 1) return map.setView(points[0], 15);
      map.fitBounds(points, { padding: [50, 40], maxZoom: 15 });
    },
    center() { const c = map.getCenter(); return [c.lat, c.lng]; },
    resize() { map.invalidateSize(); },
    destroy() { map.remove(); },
  };
}

function numberPin(n, lat, lng, active, onClick, id) {

// 지도 문제를 앱에 알리는 통로 (App이 연결)
let reportMapFail = () => {};

function MapView({ engine, markers, fitKey, focus, onReady, onMapClick, initialCenter, initialZoom = 13 }) {
  const el = useRef(null); const ad = useRef(null); const clickRef = useRef(onMapClick);
  clickRef.current = onMapClick;
  useEffect(() => {
    if (!engine || engine === 'none') return;
    let a;
    try {
      a = makeAdapter(engine, el.current, { center: initialCenter || DEFAULT_CENTER, zoom: initialZoom,
        onMapClick: (lat, lng) => clickRef.current && clickRef.current(lat, lng) });
    } catch (e) {
      console.error(e);
      reportMapFail(engine, `지도를 만들지 못했어요 (${e.message || e})`);
      return;
    }
    ad.current = a; onReady && onReady(a);
    a.setMarkers(markers);
    if (fitKey && markers.length) a.fit(markers.filter((m) => m.id !== 'me').map((m) => [m.lat, m.lng]));
    const timers = [80, 400, 1200].map((ms) => setTimeout(() => a.resize(), ms));
    const onWin = () => a.resize();
    window.addEventListener('resize', onWin);
    // 네이버 지도가 오류 없이 빈 화면으로 남는 경우(인증 문제 등)를 확인 → 기본 지도로
    const check = engine === 'naver' ? setTimeout(() => {
      const box = el.current;
      if (box && box.clientHeight > 0 && a.drawn && !a.drawn()) {
        reportMapFail('naver', '네이버 지도가 그려지지 않았어요 (인증 문제로 보여요)');
      }
    }, 7000) : null;
    return () => { timers.forEach(clearTimeout); clearTimeout(check); window.removeEventListener('resize', onWin); a.destroy(); ad.current = null; };
  }, [engine]);
  useEffect(() => { ad.current && ad.current.setMarkers(markers); }, [markers]);
  useEffect(() => {
    if (ad.current && fitKey) { const pts = markers.filter((m) => m.id !== 'me').map((m) => [m.lat, m.lng]); pts.length && ad.current.fit(pts); }
  }, [fitKey]);
  useEffect(() => { if (ad.current && focus) ad.current.focus(focus.lat, focus.lng, focus.zoom); }, [focus]);
  return (
    <div className="absolute inset-0 z-0 bg-[#F3EDE7]">
      <div ref={el} className="absolute inset-0" />
      {!engine && <div className="absolute inset-0 grid place-items-center"><div className="spinner" /></div>}
    </div>
  );
}

// 가게 이름 + 지역으로 네이버 사진 검색어 만들기 ("비숑하우스" + "세종특별자치시 …" → "비숑하우스 세종")
// 주소에서 도시 이름 뽑기: "대전광역시 중구" → 대전, "충청남도 공주시" → 공주, "세종특별자치시" → 세종
const cityOf = (address = '') => {
  const [a = '', b = ''] = address.split(/\s+/);
  const isProvince = (/(도|특별자치도)$/.test(a) && !/특별자치시$/.test(a)) || /^(경기|강원|충북|충남|전북|전남|경북|경남|제주)$/.test(a);
  const raw = isProvince ? b : a;
  return raw.replace(/(특별자치시|특별자치도|특별시|광역시|시|군)$/, '') || a;
};
const photoQueryOf = (name = '', address = '') => {
  const city = cityOf(address);
  return (city && !name.includes(city) ? `${name} ${city}` : name).trim();
};

function WebPhotos({ query, value, onPick }) {

      setState({ loading: false, items, error: null, q });
      if (autoPick && items[0]) onPick(items[0]);
    } catch (e) { setState({ loading: false, items: [], error: e, q }); }

  useEffect(() => {

  if (!query) return <p className="rounded-2xl bg-white px-4 py-3 text-[13px] text-ink-500 ring-1 ring-ink-400/15">가게를 먼저 고르면 네이버에서 사진을 자동으로 찾아와요.</p>;

      (p) => { const ll = { lat: p.coords.latitude, lng: p.coords.longitude }; onChange(ll); setFocus({ ...ll, zoom: 16, t: Date.now() }); setLocating(false); },
      () => { setLocating(false); alert('위치 권한을 허용하면 현재 위치로 핀을 꽂을 수 있어요.'); },
      { enableHighAccuracy: true, timeout: 8000 });

  return (
    <div className="relative h-44 overflow-hidden rounded-2xl ring-1 ring-ink-400/20">
      <MapView engine={engine} markers={markers} focus={focus} initialZoom={value ? 16 : 14}

  return (

      <SearchBox value={q} onChange={setQ} onSubmit={run} loading={state.loading} placeholder="카페 이름 + 동네 (예: 성수 비숑카페)" />
      {!searchEnabled && !state.error && (
        <p className="px-1 text-[12px] text-ink-400">네이버 검색 키를 설정하면 여기서 바로 가게를 찾을 수 있어요.</p>
      )}
      <SearchNotice error={state.error} query={state.query} />
      {state.items && state.items.length === 0 && (
        <p className="rounded-2xl bg-white px-4 py-3 text-[13px] text-ink-500 ring-1 ring-ink-400/15">검색 결과가 없어요. 동네 이름을 함께 넣어 보세요.</p>
      )}
      {state.items && state.items.map((it, i) => (
        <button type="button" key={i} onClick={() => { vibrate(); onPick(it); }}
          className="flex w-full items-start gap-3 rounded-2xl bg-white p-3 text-left ring-1 ring-ink-400/15 active:scale-[.98]">
          <span className="mt-0.5 grid h-6 w-6 shrink-0 place-items-center rounded-full bg-coral-500 text-xs font-extrabold text-white">{i + 1}</span>
          <span className="min-w-0 flex-1">
            <span className="block text-[14px] font-bold text-ink-900">{it.name}</span>
            <span className="block text-[12px] text-ink-400">{it.category}</span>
            <span className="block text-[12px] text-ink-700">{it.roadAddress || it.address}</span>
          </span>
          <span className="self-center text-[12px] font-bold text-coral-600">선택</span>
        </button>
      ))}
    </div>
  );
}

function AddCafeSheet({ initial, prefill, engine, center, searchEnabled, onClose, onSave }) {
  const [f, setF] = useState(() => initial || {
    name: prefill ? prefill.name : '', address: prefill ? (prefill.roadAddress || prefill.address) : '',
    category: prefill ? prefill.category : '', link: prefill ? prefill.link : '',
    lat: prefill ? prefill.lat : null, lng: prefill ? prefill.lng : null,
    date: todayStr(), rating: 0, photo: '', photoThumb: '', memo: '', review: '',
    tags: { babyChair: false, stroller: false, pet: /애견|반려|펫|강아지|도그|dog/i.test(prefill ? prefill.name + prefill.category : '') },
  });
  const fromNaver = !!(f.category || prefill) && f.lat != null;
  const [placeMode, setPlaceMode] = useState(initial || prefill ? 'picked' : 'search'); // search | picked | manual
  const [photoMode, setPhotoMode] = useState(() => {
    if (!initial || !initial.photo || initial.photoThumb) return 'web';
    return SAMPLE_PHOTOS.some((p) => p.url === initial.photo) ? 'sample' : 'url';
  });
  const photoQuery = f.name.trim() && f.lat != null ? photoQueryOf(f.name.trim(), f.address) : '';
  const pickWeb = (it) => setF((p) => ({ ...p, photo: it.url || it.thumb, photoThumb: it.thumb || '' }));
  const [err, setErr] = useState('');
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const toggleTag = (k) => { vibrate(); setF((p) => ({ ...p, tags: { ...p.tags, [k]: !p.tags[k] } })); };

  const pick = (it) => {
    setF((p) => ({ ...p, name: it.name, address: it.roadAddress || it.address, category: it.category, link: it.link, lat: it.lat, lng: it.lng,
      // 가게가 바뀌면 자동으로 넣었던 네이버 사진은 비워서 새 가게 사진을 다시 찾게 함
      ...(p.photoThumb || !p.photo ? { photo: '', photoThumb: '' } : {}),
      tags: { ...p.tags, pet: p.tags.pet || /애견|반려|펫|강아지|도그|dog/i.test(it.name + it.category) } }));
    setPlaceMode('picked'); setErr('');
  };
  const submit = (e) => {
    e.preventDefault();
    if (!f.name.trim()) return setErr('카페를 검색해서 고르거나 이름을 입력해 주세요.');
    if (f.lat == null) return setErr('지도에서 위치를 찍어 주세요.');
    if (!f.rating) return setErr('별점을 골라 주세요.');
    vibrate(15);
    const { sample, ...rest } = f;
    onSave({ ...rest, name: f.name.trim(), id: f.id || `c${Date.now()}` });
  };

  const label = 'mb-1.5 block text-[13px] font-bold text-ink-700';
  const input = 'w-full rounded-2xl bg-white px-4 py-3 text-ink-900 ring-1 ring-ink-400/20 outline-none focus:ring-2 focus:ring-coral-400 placeholder:text-ink-400/70';

  return (
    <div className="fixed inset-0 z-[1000] fade-in">
      <div className="absolute inset-0 bg-ink-900/40" onClick={onClose} />
      <form onSubmit={submit} className="absolute inset-x-0 bottom-0 mx-auto flex max-h-[94dvh] max-w-md flex-col rounded-t-[28px] bg-cream sheet-up">
        <div className="flex items-center justify-between border-b border-ink-400/10 px-5 py-4">
          <button type="button" onClick={onClose} className="text-sm font-semibold text-ink-500">취소</button>
          <h2 className="text-base font-extrabold">{initial ? '기록 수정' : '방문 기록 추가'}</h2>
          <button type="submit" className="text-sm font-extrabold text-coral-600">저장</button>
        </div>

        <div className="flex-1 space-y-5 overflow-y-auto no-scrollbar px-5 py-5">
          {/* 1. 장소 */}
          <div>
            <label className={label}>어디에 다녀왔나요? *</label>
            {placeMode === 'search' && (
              <>
                <PlacePicker searchEnabled={searchEnabled} onPick={pick} />
                <button type="button" onClick={() => setPlaceMode('manual')} className="mt-2 text-[13px] font-semibold text-ink-500 underline">검색이 안 되면 직접 입력하기</button>
              </>
            )}
            {placeMode === 'picked' && (
              <div className="rounded-2xl bg-white p-4 ring-1 ring-ink-400/15">
                <div className="flex items-start gap-2">
                  {fromNaver && <NaverN />}
                  <div className="min-w-0 flex-1">
                    <p className="text-[15px] font-extrabold text-ink-900">{f.name}</p>
                    {f.category && <p className="text-[12px] text-ink-400">{f.category}</p>}
                    <p className="mt-0.5 text-[13px] text-ink-700">{f.address || '주소 없음'}</p>
                  </div>
                  <button type="button" onClick={() => setPlaceMode('search')} className="shrink-0 rounded-full bg-coral-50 px-3 py-1.5 text-[12px] font-bold text-coral-600">다시 찾기</button>
                </div>
                <button type="button" onClick={() => setPlaceMode('manual')} className="mt-2 text-[12px] font-semibold text-ink-400 underline">이름·위치 직접 고치기</button>
              </div>
            )}
            {placeMode === 'manual' && (
              <div className="space-y-3">
                <input className={input} value={f.name} onChange={(e) => set('name', e.target.value)} placeholder="카페 이름" />
                <input className={input} value={f.address} onChange={(e) => set('address', e.target.value)} placeholder="주소 (예: 서울 성동구 서울숲길 00)" />
                <LocationPicker engine={engine} center={center} value={f.lat != null ? { lat: f.lat, lng: f.lng } : null}
                  onChange={(ll) => setF((p) => ({ ...p, ...ll }))} />
                <button type="button" onClick={() => setPlaceMode('search')} className="text-[13px] font-semibold text-naver-600 underline">← 네이버에서 검색하기</button>
              </div>
            )}
          </div>

          {/* 2. 날짜 · 별점 */}
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className={label}>방문 날짜</label>
              <input type="date" className={input} value={f.date} max={todayStr()} onChange={(e) => set('date', e.target.value)} />
            </div>
            <div>
              <label className={label}>별점 *</label>
              <div className="flex h-[50px] items-center justify-between rounded-2xl bg-white px-2 ring-1 ring-ink-400/20">
                {[1, 2, 3, 4, 5].map((n) => (
                  <button type="button" key={n} onClick={() => { vibrate(); set('rating', n); }} aria-label={`${n}점`}
                    className={`text-[26px] leading-none transition active:scale-125 ${n <= f.rating ? 'text-honey-500' : 'text-ink-400/25'}`}>★</button>
                ))}
              </div>
            </div>
          </div>

          {/* 3. 체크리스트 */}
          <div>
            <label className={label}>우리 가족 체크리스트</label>
            <div className="grid grid-cols-3 gap-2">
              {TAGS.map((t) => {
                const on = !!f.tags[t.key];
                return (
                  <button type="button" key={t.key} onClick={() => toggleTag(t.key)} aria-pressed={on} data-tag={t.key}
                    className={`relative flex flex-col items-center gap-1 rounded-2xl py-3 text-[12px] font-bold ring-1 transition active:scale-95 ${on ? t.on + ' ring-2' : 'bg-white text-ink-500 ring-ink-400/20'}`}>
                    <span className={`absolute right-2 top-2 grid h-4 w-4 place-items-center rounded-[5px] text-[10px] ${on ? 'bg-current' : 'ring-1 ring-ink-400/40'}`}>{on && <span className="text-white">✓</span>}</span>
                    <span className="grid h-8 place-items-center text-2xl"><TagIcon tag={t} className="h-8 w-8" /></span>{t.label}
                  </button>
                );
              })}
            </div>
          </div>

          {/* 4. 사진 */}
          <div>
            <label className={label}>사진</label>
            <div className="mb-2 flex rounded-full bg-white p-1 text-[13px] font-bold ring-1 ring-ink-400/15">
              {[['web', '네이버 사진'], ['sample', '샘플'], ['url', 'URL']].map(([k, l]) => (
                <button type="button" key={k} onClick={() => setPhotoMode(k)}
                  className={`flex-1 rounded-full py-1.5 ${photoMode === k ? 'bg-coral-500 text-white' : 'text-ink-500'}`}>{l}</button>
              ))}
            </div>
            {photoMode === 'web' && <WebPhotos query={photoQuery} value={f.photo} onPick={pickWeb} />}
            {photoMode === 'sample' && (
              <div className="grid grid-cols-3 gap-2">
                {SAMPLE_PHOTOS.map((p) => (
                  <button type="button" key={p.url} onClick={() => setF((x) => ({ ...x, photo: p.url, photoThumb: '' }))}
                    className={`relative overflow-hidden rounded-xl ${f.photo === p.url ? 'ring-[3px] ring-coral-500' : ''}`}>
                    <Photo src={p.url} alt={p.label} className="h-20 w-full" />
                    <span className="absolute inset-x-0 bottom-0 bg-black/40 py-0.5 text-[10px] font-semibold text-white">{p.label}</span>
                  </button>
                ))}
              </div>
            )}
            {photoMode === 'url' && (
              <div className="flex gap-2">
                <input className={input} inputMode="url" value={f.photo && !f.photo.startsWith('data:') ? f.photo : ''}
                  onChange={(e) => setF((x) => ({ ...x, photo: e.target.value, photoThumb: '' }))} placeholder="https://…" />
                <Photo src={f.photo} alt="" className="h-[50px] w-[50px] shrink-0 rounded-xl" />
              </div>
            )}
          </div>

          {/* 5. 메모 */}
          <div>
            <label className={label}>한 줄 메모</label>
            <input className={input} maxLength={40} value={f.memo} onChange={(e) => set('memo', e.target.value)} placeholder="카드에 보일 한 줄 (40자)" />
          </div>
          <div>
            <label className={label}>후기</label>
            <textarea className={input + ' min-h-[96px] resize-none'} value={f.review} onChange={(e) => set('review', e.target.value)}
              placeholder="수유실, 기저귀 교환대, 주차, 반려견 동반 구역 등" />
          </div>
          {err && <p className="rounded-xl bg-coral-50 px-3 py-2 text-sm font-semibold text-coral-700">{err}</p>}
        </div>

        <div className="border-t border-ink-400/10 bg-cream px-5 pt-3 pb-safe">
          <button type="submit" className="mb-3 w-full rounded-2xl bg-coral-500 py-4 text-base font-extrabold text-white shadow-lg shadow-coral-500/30 active:scale-[.98]">
            {initial ? '수정 완료' : '기록 저장하기'}
          </button>
        </div>
      </form>
    </div>
  );
}

/* ───────────────────────── 시작 지역 선택 ───────────────────────── */
function RegionSheet({ current, firstRun, onDone, onClose }) {
  const MAX = 5;
  const [sel, setSel] = useState(() => current || []);
  const [filter, setFilter] = useState('');
  const [openProv, setOpenProv] = useState(null);
  const [locating, setLocating] = useState(false);
  const f = filter.trim();
  const isSel = (name) => sel.some((r) => r.name === name);

  const toggle = (r) => {
    vibrate();
    setSel((prev) => {
      if (prev.some((x) => x.name === r.name)) return prev.filter((x) => x.name !== r.name);
      if (prev.length >= MAX) { alert(`지역은 ${MAX}곳까지 고를 수 있어요.`); return prev; }
      return [...prev, r];
    });
  };
  const cityRegion = (prov, [name, lat, lng]) => ({ name, province: prov, lat, lng, zoom: 13 });
  const toggleHere = () => {
    const had = sel.find((r) => r.here);
    if (had) return setSel((p) => p.filter((r) => !r.here));
    if (!navigator.geolocation) return alert('이 기기에서는 위치를 쓸 수 없어요.');
    setLocating(true);
    navigator.geolocation.getCurrentPosition(async (p) => {
      const lat = p.coords.latitude, lng = p.coords.longitude;
      const area = await reverseArea(lat, lng);
      setLocating(false);
      toggle({ name: area || '내 주변', searchName: area || '', here: true, lat, lng, zoom: 14 });
    }, () => { setLocating(false); alert('위치 권한을 허용하면 지금 있는 곳을 추가할 수 있어요.'); },
    { enableHighAccuracy: true, timeout: 8000 });
  };

  const cityMatches = f ? PROVINCES.flatMap((p) => p.cities.filter((c) => c[0].includes(f) || p.name.includes(f)).map((c) => [p.name, c])) : [];
  const metroMatches = f ? METROS.filter((m) => m.name.includes(f)) : METROS;
  const Check = ({ on }) => (
    <span className={`grid h-4 w-4 shrink-0 place-items-center rounded-[5px] text-[10px] ${on ? 'bg-white text-coral-600' : 'ring-1 ring-ink-400/40'}`}>{on && '✓'}</span>
  );
  const chip = (on) => `flex items-center justify-center gap-1.5 rounded-2xl px-2 py-3 text-[15px] font-bold transition active:scale-95 ${on ? 'bg-coral-500 text-white shadow-md' : 'bg-white text-ink-700 ring-1 ring-ink-400/20'}`;
  const hereSel = sel.find((r) => r.here);

  return (
    <div className="fixed inset-0 z-[1150] fade-in">
      <div className="absolute inset-0 bg-ink-900/40" onClick={firstRun ? undefined : onClose} />
      <div className={`absolute inset-x-0 bottom-0 mx-auto flex max-w-md flex-col bg-cream sheet-up ${firstRun ? 'h-[100dvh]' : 'max-h-[92dvh] rounded-t-[28px]'}`}>
        <div className={`px-5 pb-3 ${firstRun ? 'pt-[calc(env(safe-area-inset-top)+24px)]' : 'pt-5'}`}>
          {firstRun ? (
            <div className="mb-4 flex flex-col items-center text-center">
              <span className="grid h-20 w-20 place-items-center rounded-[28px] bg-coral-100"><Bichon className="h-16 w-16" /></span>
              <h2 className="mt-3 text-[22px] font-extrabold text-ink-900">어디로 나들이 다니세요?</h2>
              <p className="mt-1 text-sm text-ink-500">자주 가는 지역을 <b>여러 곳</b> 골라도 돼요. 처음 고른 곳에서 지도가 열리고,<br />네이버 검색은 고른 지역 모두에서 찾아요.</p>
            </div>
          ) : (
            <div className="mb-3 flex items-center justify-between">
              <div>
                <h2 className="text-lg font-extrabold text-ink-900">우리 나들이 지역</h2>
                <p className="text-[12px] text-ink-400">여러 곳 선택 가능 · 처음 고른 곳이 시작 지역</p>
              </div>
              <button onClick={onClose} aria-label="닫기" className="h-9 w-9 rounded-full bg-white text-ink-500 ring-1 ring-ink-400/20">✕</button>
            </div>
          )}

          {/* 고른 지역 */}
          <div className="mb-3 flex min-h-[36px] flex-wrap items-center gap-1.5">
            {sel.length === 0 && <span className="text-[13px] text-ink-400">아직 고른 지역이 없어요</span>}
            {sel.map((r, i) => (
              <button key={r.name} onClick={() => toggle(r)}
                className="inline-flex items-center gap-1 rounded-full bg-coral-50 py-1 pl-2.5 pr-2 text-[13px] font-bold text-coral-700 ring-1 ring-coral-100 active:scale-95">
                {i === 0 && <span className="rounded-full bg-coral-500 px-1.5 text-[10px] text-white">시작</span>}
                {r.name}<span className="text-coral-400">✕</span>
              </button>
            ))}
          </div>

          <button onClick={toggleHere}
            className={`mb-3 flex w-full items-center justify-center gap-2 rounded-2xl py-3 text-[15px] font-bold ring-1 active:scale-[.98] ${hereSel ? 'bg-sky2-500 text-white ring-sky2-500' : 'bg-sky2-50 text-sky2-700 ring-sky2-100'}`}>
            {locating ? <div className="spinner" /> : hereSel ? '✓' : '◎'} 지금 있는 곳 {hereSel ? `(${hereSel.name}) 추가됨` : '추가하기'}
          </button>
          <input value={filter} onChange={(e) => setFilter(e.target.value)} placeholder="도시 이름으로 찾기 (예: 천안, 동탄)"
            className="w-full rounded-2xl bg-white px-4 py-3 text-ink-900 outline-none ring-1 ring-ink-400/20 focus:ring-2 focus:ring-coral-400 placeholder:text-ink-400/70" />
        </div>

        <div className="flex-1 overflow-y-auto no-scrollbar px-5 pb-4">
          {metroMatches.length > 0 && (
            <>
              <h3 className="mb-2 mt-1 text-[12px] font-bold text-ink-400">특별·광역시</h3>
              <div className="grid grid-cols-4 gap-2">
                {metroMatches.map((m) => (
                  <button key={m.name} onClick={() => toggle(m)} aria-pressed={isSel(m.name)} className={chip(isSel(m.name))}>
                    <Check on={isSel(m.name)} />{m.name}
                  </button>
                ))}
              </div>
            </>
          )}
          {f ? (
            cityMatches.length > 0 && (
              <>
                <h3 className="mb-2 mt-5 text-[12px] font-bold text-ink-400">도시</h3>
                <div className="grid grid-cols-3 gap-2">
                  {cityMatches.map(([prov, c]) => (
                    <button key={prov + c[0]} onClick={() => toggle(cityRegion(prov, c))} aria-pressed={isSel(c[0])} className={chip(isSel(c[0]))}>
                      <Check on={isSel(c[0])} /><span>{c[0]}<span className="block text-[11px] font-semibold opacity-60">{prov}</span></span>
                    </button>
                  ))}
                </div>
              </>
            )
          ) : (
            <>
              <h3 className="mb-2 mt-5 text-[12px] font-bold text-ink-400">도</h3>
              <div className="space-y-2">
                {PROVINCES.map((p) => {
                  const open = openProv === p.name;
                  const picked = sel.filter((r) => r.province === p.name);
                  return (
                    <div key={p.name} className="rounded-2xl bg-white ring-1 ring-ink-400/15">
                      <button onClick={() => setOpenProv(open ? null : p.name)} className="flex w-full items-center justify-between px-4 py-3.5">
                        <span className="text-[15px] font-bold text-ink-900">{p.name}
                          {picked.length > 0 && <span className="ml-2 rounded-full bg-coral-50 px-2 py-0.5 text-[11px] text-coral-600">{picked.map((r) => r.name).join(' · ')}</span>}
                        </span>
                        <span className={`text-ink-400 transition ${open ? 'rotate-180' : ''}`}>▾</span>
                      </button>
                      {open && (
                        <div className="grid grid-cols-3 gap-2 px-3 pb-3 fade-in">
                          {p.cities.map((c) => {
                            const on = isSel(c[0]);
                            return (
                              <button key={c[0]} onClick={() => toggle(cityRegion(p.name, c))} aria-pressed={on}
                                className={`flex items-center justify-center gap-1.5 rounded-xl py-2.5 text-[14px] font-bold active:scale-95 ${on ? 'bg-coral-500 text-white' : 'bg-cream text-ink-700'}`}>
                                <Check on={on} />{c[0]}
                              </button>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </>
          )}
          {f && metroMatches.length === 0 && cityMatches.length === 0 && (
            <p className="mt-6 text-center text-sm text-ink-500">목록에 없는 곳이면 ‘지금 있는 곳 추가하기’를 써 주세요.</p>
          )}
        </div>

        <div className="border-t border-ink-400/10 px-5 pt-3 pb-[calc(env(safe-area-inset-bottom)+12px)]">
          <button disabled={!sel.length} onClick={() => onDone(sel)}
            className="w-full rounded-2xl bg-coral-500 py-4 text-base font-extrabold text-white shadow-lg shadow-coral-500/30 active:scale-[.98] disabled:bg-ink-400/30 disabled:shadow-none">
            {sel.length ? `${sel.map((r) => r.name).join(' · ')} 선택 완료` : '지역을 골라 주세요'}
          </button>
        </div>
      </div>
    </div>
  );
}

    <div className="fixed inset-0 z-[1150] fade-in">
      <div className="absolute inset-0 bg-ink-900/40" onClick={onClose} />
      <div className="absolute inset-x-0 bottom-0 mx-auto max-h-[90vh] max-w-md overflow-y-auto rounded-t-[28px] bg-cream p-5 sheet-up pb-safe">
        <div className="mb-3 flex items-center justify-between">
          <h2 className="text-lg font-extrabold">지도 점검</h2>
          <button onClick={onClose} aria-label="닫기" className="h-9 w-9 rounded-full bg-white text-ink-500 ring-1 ring-ink-400/20">✕</button>
        </div>
        <div className="mb-4 rounded-2xl bg-white p-4 text-[13px] text-ink-700 ring-1 ring-ink-400/15">
          <p>지금 지도: <b>{engine === 'naver' ? '네이버 지도' : engine === 'leaflet' ? '기본 지도' : '없음'}</b></p>
          <p>네이버 지도 키: <b>{config.naverMapKeyId ? `${config.naverMapKeyId.slice(0, 4)}…` : '없음'}</b> · 앱 주소: <b>{host}</b></p>
          {note && <p className="mt-1 text-coral-700">⚠️ {note}</p>}
        </div>
        <h3 className="mb-2 text-[13px] font-bold text-ink-500">네이버 지도가 안 나오면 확인할 것</h3>
        <ol className="mb-5 space-y-2.5">
          <Row n="1">네이버 클라우드 콘솔 → <b>Maps → Application</b>에서 이 앱을 열고 <b>Dynamic Map</b>이 체크돼 있는지</Row>
          <Row n="2">같은 화면의 <b>Web 서비스 URL</b>에 <b>http://{host}</b> 가 정확히 있는지 (끝에 / 없이)</Row>
          <Row n="3">Vercel의 <b>NAVER_MAP_KEY_ID</b> 값이 <b>Maps</b> Application의 Client ID인지 (API HUB 검색 키와 다른 값이에요)</Row>
          <Row n="4">고친 뒤 Vercel에서 <b>Redeploy</b> → 앱을 완전히 껐다 켜기</Row>
        </ol>
        <div className="grid grid-cols-2 gap-2">
          <button onClick={() => onPref('naver')} className={`rounded-2xl py-3 text-[14px] font-bold ${pref !== 'basic' ? 'bg-naver-500 text-white' : 'bg-white text-ink-700 ring-1 ring-ink-400/20'}`}>네이버 지도 다시 시도</button>
          <button onClick={() => onPref('basic')} className={`rounded-2xl py-3 text-[14px] font-bold ${pref === 'basic' ? 'bg-coral-500 text-white' : 'bg-white text-ink-700 ring-1 ring-ink-400/20'}`}>기본 지도로 계속 쓰기</button>
        </div>
        <p className="mt-2 text-center text-[11px] text-ink-400">어느 지도를 써도 네이버 검색·사진은 똑같이 동작해요</p>
      </div>
    </div>
  );
}

/* ───────────────────────── 설치 안내 ───────────────────────── */
function InstallGuide({ onClose, deferredPrompt, onInstalled }) {
  const ios = isIOS();
  const install = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') onInstalled();
  };
  const Step = ({ n, children }) => (
    <li className="flex items-start gap-3">
      <span className="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-coral-500 text-sm font-extrabold text-white">{n}</span>
      <span className="pt-0.5 text-[15px] text-ink-700">{children}</span>
    </li>
  );
  return (
    <div className="fixed inset-0 z-[1100] fade-in">
      <div className="absolute inset-0 bg-ink-900/40" onClick={onClose} />
      <div className="absolute inset-x-0 bottom-0 mx-auto max-w-md rounded-t-[28px] bg-cream p-6 sheet-up pb-safe">
        <div className="mb-4 flex items-center gap-3">
          <img src="icons/icon-192.png" alt="" className="h-14 w-14 rounded-2xl shadow" />
          <div>
            <h2 className="text-lg font-extrabold">홈 화면에 앱으로 추가</h2>
            <p className="text-sm text-ink-500">주소창 없이 전체 화면으로, 오프라인에서도 열려요</p>
          </div>
        </div>
        {deferredPrompt ? (
          <button onClick={install} className="mb-3 w-full rounded-2xl bg-coral-500 py-4 font-extrabold text-white active:scale-[.98]">지금 설치하기</button>
        ) : ios ? (
          <ol className="mb-4 space-y-3">
            <Step n="1"><b>Safari</b>에서 열어 주세요 (카톡·인스타 내부 브라우저에선 안 돼요)</Step>
            <Step n="2">아래쪽 <b>공유 버튼</b> <span className="inline-block rounded-md bg-white px-1.5 ring-1 ring-ink-400/20">⬆︎</span> 을 눌러요</Step>
            <Step n="3">목록을 내려서 <b>‘홈 화면에 추가’</b> → <b>추가</b></Step>
          </ol>
        ) : (
          <ol className="mb-4 space-y-3">
            <Step n="1"><b>Chrome / 삼성 인터넷</b>에서 열어 주세요</Step>
            <Step n="2">오른쪽 위(삼성은 아래) <b>⋮ 메뉴</b>를 눌러요</Step>
            <Step n="3"><b>‘홈 화면에 추가’</b> 또는 <b>‘앱 설치’</b>를 선택해요</Step>
          </ol>
        )}
        <button onClick={onClose} className="mb-3 w-full rounded-2xl bg-white py-3.5 text-sm font-bold text-ink-500 ring-1 ring-ink-400/20">나중에</button>
      </div>
    </div>
  );
}

/* ───────────────────────── 앱 ───────────────────────── */
function App() {
  const [cafes, setCafes] = useState(loadCafes);
  const [config, setConfig] = useState({ naverMapKeyId: '', searchEnabled: false });
  const [engine, setEngine] = useState(null); // null(로딩) | 'naver' | 'leaflet' | 'none'
  const [mapNote, setMapNote] = useState(''); // 지도가 네이버가 아닐 때 그 이유
  const [mapPref] = useState(() => { try { return localStorage.getItem(MAP_PREF_KEY) || 'naver'; } catch (e) { return 'naver'; } });
  const [showMapHelp, setShowMapHelp] = useState(false);
  const [filters, setFilters] = useState({ pet: false, stroller: false, babyChair: false });
  const [selectedId, setSelectedId] = useState(null);
  const [detailId, setDetailId] = useState(null);
  const [editing, setEditing] = useState(null); // null | {mode:'new', prefill?} | cafe
  const [mapOpen, setMapOpen] = useState(true);
  const [toast, setToast] = useState('');
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [showInstall, setShowInstall] = useState(false);
  const [standalone, setStandalone] = useState(isStandalone());
  const [focus, setFocus] = useState(null);
  const [me, setMe] = useState(null);
  const [fitKey, setFitKey] = useState(0);
  // 시작 지역
  const [regions, setRegions] = useState(loadRegions); // [시작 지역, ...]
  const [showRegion, setShowRegion] = useState(() => !loadRegions());
  const region = regions ? regions[0] : null; // 시작 지역
  const [scoped, setScoped] = useState(true); // 검색을 시작 지역 안에서
  // 네이버 검색 상태
  const [q, setQ] = useState('');
  const [searchFocused, setSearchFocused] = useState(false);
  const [search, setSearch] = useState(null); // null | {query, loading, items, error}
  const [activeRes, setActiveRes] = useState(null);
  const [area, setArea] = useState('');
  const adapterRef = useRef(null);

  const flash = (msg, ms = 2400) => { setToast(msg); setTimeout(() => setToast(''), ms); };

  // 설정 불러오기 → 네이버 지도 로드 (실패하면 대체 지도)
  useEffect(() => {
    (async () => {
      let cfg = { naverMapKeyId: '', searchEnabled: false };
      try {
        const r = await fetch('api/config', { cache: 'no-store' });
        if (r.ok && (r.headers.get('content-type') || '').includes('json')) cfg = await r.json();
      } catch (e) {}
      setConfig(cfg);
      // 네이버 지도 → 실패하면 기본 지도 → 그것도 실패하면 안내 문구
      let usedBasic = false;
      const fallback = async (why) => {
        if (why) setMapNote(why);
        if (usedBasic) return; usedBasic = true;
        try { await loadLeaflet(); setEngine('leaflet'); }
        catch (e) { setEngine('none'); setMapNote('지도를 불러오지 못했어요. 인터넷 연결을 확인하고 앱을 다시 열어 주세요'); }
      };
      reportMapFail = (eng, why) => {
        if (eng === 'naver') fallback(why);
        else { setEngine('none'); setMapNote(why); }
      };
      if (mapPref === 'basic') return fallback('기본 지도로 쓰는 중 (지도 점검에서 바꿀 수 있어요)');
      if (cfg.naverMapKeyId) {
        window.navermap_authFailure = () => fallback('네이버 지도 인증 실패: 네이버 클라우드에 등록한 Web 서비스 URL(famcafe.vercel.app)을 확인해 주세요');
        try {
          await loadScript(`https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(cfg.naverMapKeyId)}&submodules=geocoder`);
          if (window.naver && naver.maps && naver.maps.Map) { setEngine('naver'); return; }
        } catch (e) {}
        return fallback('네이버 지도 스크립트를 불러오지 못했어요');
      }
      fallback(cfg.searchEnabled ? '네이버 지도 키(NAVER_MAP_KEY_ID)가 Vercel에 없어요' : '');
    })();
  }, []);

  useEffect(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cafes)); } catch (e) { flash('저장 공간이 부족해요. 사진 용량을 줄여 주세요.'); } }, [cafes]);

  // 예전에 기본 샘플 사진으로 저장된 곳은 네이버 사진으로 한 번 자동 교체
  useEffect(() => {
    if (!config.searchEnabled) return;
    const todo = cafes.filter((c) => c.name && !c.photoThumb && !c.photoTried && (!c.photo || c.photo === SAMPLE_PHOTOS[0].url));
    if (!todo.length) return;
    let stop = false;
    (async () => {
      let filled = 0;
      for (const c of todo) {
        if (stop) break;
        try {
          const items = await naverImages(photoQueryOf(c.name, c.address));
          const it = items[0];
          setCafes((prev) => prev.map((x) => (x.id === c.id
            ? { ...x, photoTried: true, ...(it ? { photo: it.url || it.thumb, photoThumb: it.thumb || '' } : {}) } : x)));
          if (it) filled++;
        } catch (e) {
          // 권한/설정 문제면 멈추고 알려줌 (설정 후 다음 실행 때 다시 시도)
          flash(`📷 사진 자동 채우기 실패: ${e.message}`, 6000);
          break;
        }
        await new Promise((r) => setTimeout(r, 250));
      }
      if (filled) flash(`📷 ${filled}곳에 네이버 사진을 넣었어요`);
    })();
    return () => { stop = true; };
  }, [config.searchEnabled]);

  // 설치 프롬프트(안드로이드/크롬) + 첫 방문 안내
  useEffect(() => {
    const onPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); };
    const onInstalled = () => { setStandalone(true); setShowInstall(false); flash('홈 화면에 설치됐어요! 🎉'); };
    window.addEventListener('beforeinstallprompt', onPrompt);
    window.addEventListener('appinstalled', onInstalled);
    let dismissed = false; try { dismissed = localStorage.getItem('install-dismissed') === '1'; } catch (e) {}
    const t = !isStandalone() && !dismissed ? setTimeout(() => setShowInstall(true), 2500) : null;
    return () => { window.removeEventListener('beforeinstallprompt', onPrompt); window.removeEventListener('appinstalled', onInstalled); clearTimeout(t); };
  }, []);

  const visible = useMemo(() =>
    cafes.filter((c) => Object.entries(filters).every(([k, on]) => !on || c.tags[k]))
      .sort((a, b) => (b.date || '').localeCompare(a.date || '')), [cafes, filters]);

  useEffect(() => { if (selectedId && !visible.some((c) => c.id === selectedId)) setSelectedId(null); }, [visible]);
  useEffect(() => { if (adapterRef.current) setTimeout(() => adapterRef.current && adapterRef.current.resize(), 320); }, [mapOpen]);

  const savedByName = useMemo(() => {
    const m = {}; cafes.forEach((c) => { m[norm(c.name)] = c; }); return m;
  }, [cafes]);

  const selectSaved = useCallback((id, from) => {
    vibrate(); setSelectedId(id);
    const c = cafes.find((x) => x.id === id);
    if (c && c.lat != null) setFocus({ lat: c.lat, lng: c.lng, t: Date.now() });
    if (from === 'map') { const el = document.getElementById(`card-${id}`); el && el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  }, [cafes]);

  const selectResult = useCallback((i, from) => {
    vibrate(); setActiveRes(i);
    const it = search && search.items && search.items[i];
    if (it) setFocus({ lat: it.lat, lng: it.lng, zoom: 16, t: Date.now() });
    if (from === 'map') { const el = document.getElementById(`res-${i}`); el && el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  }, [search]);

  const markers = useMemo(() => {
    const list = search && search.items
      ? search.items.map((it, i) => numberPin(i + 1, it.lat, it.lng, i === activeRes, () => selectResult(i, 'map'), `r${i}`))
      : visible.filter((c) => c.lat != null).map((c) => savedPin(c, c.id === selectedId, () => selectSaved(c.id, 'map')));
    return me ? [...list, meDot(me.lat, me.lng)] : list;
  }, [visible, selectedId, search, activeRes, me, selectSaved, selectResult]);

  // 검색창을 열 때 지도 중심 동네 이름 (네이버 역지오코딩)
  const onSearchFocus = async () => {
    setSearchFocused(true);
    if (engine === 'naver' && adapterRef.current) {
      const [lat, lng] = adapterRef.current.center();
      const name = await reverseArea(lat, lng); if (name) setArea(name);
    }
  };

  const regionNames = (regions || []).map(searchNameOf).filter(Boolean);
  const regionName = regionNames[0] || '';
  const multi = regionNames.length > 1;
  const goRegion = (r) => setFocus({ lat: r.lat, lng: r.lng, zoom: r.zoom, t: Date.now() });

  const chooseRegions = (list) => {
    setRegions(list); setShowRegion(false); setArea(''); setScoped(true);
    try { localStorage.setItem(REGION_KEY, JSON.stringify(list)); } catch (e) {}
    goRegion(list[0]);
    if (!mapOpen) setMapOpen(true);
    flash(list.length > 1 ? `📍 ${list.map((r) => r.name).join(' · ')} — ${list[0].name}에서 시작할게요` : `📍 ${list[0].name}에서 시작할게요`);
  };

  const runSearch = async (input) => {
    input = (input || '').trim(); if (!input) return;
    // 고른 지역 안에서 찾기: 검색어에 지역 이름이 없으면 지역마다 따로 검색해서 합침
    const typedRegion = regionNames.some((n) => input.includes(n));
    const queries = scoped && regionNames.length && !typedRegion ? regionNames.map((n) => `${n} ${input}`) : [input];
    const label = queries.length > 1 ? `${regionNames.join('·')} ‘${input}’` : `‘${queries[0]}’`;
    const base = { query: queries[0], label, multi: queries.length > 1 };
    setQ(input); setSearchFocused(false); setActiveRes(null); setSelectedId(null);
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    setSearch({ ...base, loading: true, items: null, error: null });
    const settled = await Promise.allSettled(queries.map((qq) => naverSearch(qq)));
    const ok = settled.filter((s) => s.status === 'fulfilled');
    if (!ok.length) return setSearch({ ...base, loading: false, items: null, error: settled[0].reason });
    const seen = new Set(); const items = [];
    settled.forEach((s, i) => {
      if (s.status !== 'fulfilled') return;
      s.value.forEach((it) => {
        const key = norm(it.name) + norm(it.roadAddress || it.address);
        if (seen.has(key)) return; seen.add(key);
        items.push({ ...it, region: queries.length > 1 ? regionNames[i] : '' });
      });
    });
    setSearch({ ...base, loading: false, items, error: null });
    setFitKey((k) => k + 1); if (!mapOpen) setMapOpen(true);
  };
  const closeSearch = () => {
    setSearch(null); setQ(''); setActiveRes(null); setSearchFocused(false);
    if (region) setFocus({ lat: region.lat, lng: region.lng, zoom: region.zoom, t: Date.now() });
  };

  const locateMe = () => {
    if (!navigator.geolocation) return flash('이 기기에서는 위치를 쓸 수 없어요');
    navigator.geolocation.getCurrentPosition(
      (p) => { const ll = { lat: p.coords.latitude, lng: p.coords.longitude }; setMe(ll); setFocus({ ...ll, zoom: 15, t: Date.now() }); },
      () => flash('위치 권한을 허용하면 내 주변을 볼 수 있어요'), { enableHighAccuracy: true, timeout: 8000 });
  };

  const onCardClick = (id) => { if (selectedId === id || !mapOpen) setDetailId(id); selectSaved(id, 'list'); };

  const save = (cafe) => {
    const isNew = !cafes.some((c) => c.id === cafe.id);
    setCafes((prev) => isNew ? [cafe, ...prev] : prev.map((c) => (c.id === cafe.id ? cafe : c)));
    setEditing(null); setDetailId(null); setSearch(null); setQ(''); setActiveRes(null);
    setFilters({ pet: false, stroller: false, babyChair: false });
    setTimeout(() => { setSelectedId(cafe.id); setFocus({ lat: cafe.lat, lng: cafe.lng, zoom: 15, t: Date.now() }); }, 60);
    flash(isNew ? '우리 지도에 저장했어요 ☕' : '수정했어요');
  };
  const remove = (id) => { setCafes((p) => p.filter((c) => c.id !== id)); setDetailId(null); setSelectedId(null); flash('삭제했어요'); };
  const toggleFilter = (k) => {
    vibrate(); setSelectedId(null);
    setFilters((p) => {
      const next = { ...p, [k]: !p[k] };
      // 필터를 켜면 해당 기록들이 보이게 맞추고, 다 끄면 시작 지역으로
      if (Object.values(next).some(Boolean)) setFitKey((x) => x + 1);
      else if (region) setFocus({ lat: region.lat, lng: region.lng, zoom: region.zoom, t: Date.now() });
      return next;
    });
  };

  const detail = cafes.find((c) => c.id === detailId);
  const startCenter = region ? [region.lat, region.lng] : DEFAULT_CENTER;
  const center = adapterRef.current ? adapterRef.current.center() : startCenter;
  const inSearch = !!search;

  return (
    <div className="app-h mx-auto flex max-w-md flex-col overflow-hidden bg-cream">
      {/* 헤더 */}
      <header className="z-20 bg-cream/95 pt-safe backdrop-blur">
        <div className="flex items-center justify-between px-5 pt-3 pb-2">
          <div className="flex items-center gap-2.5">
            <span className="grid h-11 w-11 place-items-center rounded-2xl bg-coral-100"><Bichon className="h-10 w-10" /></span>
            <div>
              <button onClick={() => setShowRegion(true)}
                className="-ml-0.5 mb-0.5 inline-flex items-center gap-1 rounded-full bg-white px-2 py-0.5 text-[12px] font-bold text-coral-600 ring-1 ring-coral-100 active:scale-95">
                📍 {region ? region.name : '지역 선택'}{regions && regions.length > 1 ? ` 외 ${regions.length - 1}곳` : ''} <span className="text-[10px]">▾</span>
              </button>
              <h1 className="text-[20px] font-extrabold leading-tight tracking-tight text-ink-900">우리가족 나들이 지도</h1>
            </div>
          </div>
          {!standalone && (
            <button onClick={() => setShowInstall(true)} className="rounded-full bg-coral-50 px-3 py-2 text-[12px] font-bold text-coral-600 ring-1 ring-coral-100 active:scale-95">📲 앱 설치</button>
          )}
        </div>

        {/* 네이버 검색 */}
        <div className="px-4 pb-2">
          <div className="flex items-center gap-2">
            <div className="min-w-0 flex-1">
              <SearchBox value={q} onChange={setQ} onSubmit={runSearch} onFocus={onSearchFocus} loading={search && search.loading} />
            </div>
            {(inSearch || searchFocused) && (
              <button onClick={closeSearch} className="shrink-0 px-1 text-[14px] font-bold text-ink-500">취소</button>
            )}
          </div>
          {searchFocused && !inSearch && regionName && (
            <button onMouseDown={(e) => e.preventDefault()} onClick={() => setScoped((v) => !v)}
              className={`mt-2 inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-[12px] font-bold ring-1 fade-in ${scoped ? 'bg-coral-50 text-coral-600 ring-coral-100' : 'bg-white text-ink-400 ring-ink-400/20'}`}>
              <span className={`grid h-3.5 w-3.5 place-items-center rounded-[4px] text-[9px] ${scoped ? 'bg-coral-500 text-white' : 'ring-1 ring-ink-400/40'}`}>{scoped && '✓'}</span>
              {multi ? `${regionNames.join('·')}에서 찾기` : `${regionName} 안에서만 찾기`}
            </button>
          )}
          {searchFocused && !inSearch && (
            <div className="mt-2 flex gap-2 overflow-x-auto no-scrollbar fade-in">
              {QUICK_SEARCHES.map((s) => {
                // 지역이 여러 곳이면 검색 시 지역마다 붙으므로 추천어엔 지역 이름을 안 붙임
                const place = multi && scoped ? '' : (area || regionName);
                const query = place ? `${place} ${s}` : s;
                return (
                  <button key={s} onMouseDown={(e) => e.preventDefault()} onClick={() => runSearch(query)}
                    className="shrink-0 rounded-full bg-white px-3 py-1.5 text-[12px] font-bold text-ink-700 ring-1 ring-ink-400/20 active:scale-95">
                    {s === '애견동반 카페' ? <span className="inline-flex items-center gap-1"><Bichon className="h-4 w-4" />{query}</span> : query}
                  </button>
                );
              })}
            </div>
          )}
        </div>

        {/* 저장한 곳 필터 */}
        {!inSearch && (
          <div className="flex gap-2 overflow-x-auto no-scrollbar px-4 pb-3">
            {[
              { k: 'pet', l: '반려견 동반만', c: 'bg-sage-500', icon: <Bichon className="h-5 w-5" /> },
              { k: 'stroller', l: '유모차 가능만', c: 'bg-sky2-500', icon: '👶' },
              { k: 'babyChair', l: '아기 의자', c: 'bg-honey-500', icon: '🪑' },
            ].map(({ k, l, c, icon }) => (
              <button key={k} onClick={() => toggleFilter(k)} aria-pressed={filters[k]}
                className={`flex shrink-0 items-center gap-1.5 rounded-full px-3.5 py-2 text-[13px] font-bold transition active:scale-95 ${filters[k] ? `${c} text-white shadow-md` : 'bg-white text-ink-700 ring-1 ring-ink-400/20'}`}>
                {icon}{l}
              </button>
            ))}
          </div>
        )}
      </header>

      {/* 지도 */}
      <section className={`relative shrink-0 transition-[height] duration-300 ${mapOpen ? 'map-h' : 'h-0'}`}>
        <MapView engine={engine} markers={markers} fitKey={fitKey} focus={focus} onReady={(a) => { adapterRef.current = a; }}
          initialCenter={startCenter} initialZoom={region ? region.zoom : 12} />
        {mapOpen && (
          <button onClick={locateMe} aria-label="내 위치"
            className="absolute bottom-6 right-3 z-[500] grid h-10 w-10 place-items-center rounded-full bg-white text-lg text-sky2-500 shadow-card active:scale-95">◎</button>
        )}
        {mapOpen && regions && regions.length > 1 && (
          <div className="absolute inset-x-0 top-2 z-[500] flex gap-1.5 overflow-x-auto no-scrollbar px-2">
            {regions.map((r) => (
              <button key={r.name} onClick={() => { vibrate(); goRegion(r); }}
                className="shrink-0 rounded-full bg-white/95 px-3 py-1.5 text-[12px] font-bold text-ink-700 shadow-card active:scale-95">📍 {r.name}</button>
            ))}
          </div>
        )}
        {engine === 'leaflet' && mapOpen && (
          <button onClick={() => setShowMapHelp(true)}
            className="absolute bottom-7 left-2 z-[500] max-w-[75%] truncate rounded-full bg-white/90 px-2 py-0.5 text-left text-[10px] font-semibold text-ink-500 shadow">
            ⓘ 기본 지도{mapNote ? ` · ${mapNote}` : ' · 네이버 지도 설정 전'}
          </button>
        )}
        {engine === 'naver' && mapOpen && (
          <button onClick={() => setShowMapHelp(true)} aria-label="지도 점검"
            className="absolute bottom-6 right-16 z-[500] grid h-10 w-10 place-items-center rounded-full bg-white text-[15px] font-bold text-ink-400 shadow-card active:scale-95">?</button>
        )}
        {engine === 'none' && mapOpen && (
          <div className="absolute inset-0 z-[500] grid place-items-center p-6 text-center">
            <div><p className="text-3xl">🗺️</p><p className="mt-2 text-[13px] font-semibold text-ink-700">{mapNote}</p>
              <button onClick={() => location.reload()} className="mt-3 rounded-full bg-white px-4 py-2 text-[13px] font-bold text-coral-600 shadow-card">다시 열기</button></div>
          </div>
        )}
        <div className="pointer-events-none absolute inset-x-0 bottom-0 z-[400] h-6 bg-gradient-to-t from-cream to-transparent" />
      </section>

      {/* 하단 패널 */}
      <section className="relative z-10 -mt-3 flex min-h-0 flex-1 flex-col rounded-t-[26px] bg-cream">
        <button onClick={() => setMapOpen((v) => !v)} className="flex w-full flex-col items-center pb-1 pt-2" aria-label="지도 접기/펼치기">
          <span className="h-1.5 w-10 rounded-full bg-ink-400/30" />
        </button>

        {inSearch ? (
          <>
            <div className="flex items-baseline justify-between px-5 pb-2">
              <h2 className="truncate text-[15px] font-extrabold text-ink-900"><span className="text-naver-600">N</span> {search.label} 검색 결과</h2>
              <a href={`https://map.naver.com/p/search/${encodeURIComponent(search.query)}`} target="_blank" rel="noopener" className="shrink-0 text-[12px] font-bold text-naver-600">더 보기 →</a>
            </div>
            <div className="flex-1 space-y-3 overflow-y-auto no-scrollbar px-4 pb-32">
              {search.loading && <div className="grid place-items-center py-10"><div className="spinner" /></div>}
              <SearchNotice error={search.error} query={search.query} />
              {search.items && search.items.length === 0 && (
                <div className="mt-6 text-center text-ink-500"><p className="font-bold text-ink-700">검색 결과가 없어요</p><p className="text-sm">동네 이름을 함께 넣어 보세요 (예: 망원동 애견동반 카페)</p></div>
              )}
              {search.items && search.items.map((it, i) => {
                const saved = savedByName[norm(it.name)];
                return (
                  <SearchResult key={i} item={it} index={i} active={i === activeRes} saved={!!saved}
                    onFocus={() => selectResult(i, 'list')}
                    onRecord={() => setEditing({ mode: 'new', prefill: it })}
                    onOpenSaved={() => setDetailId(saved.id)} />
                );
              })}
              {search.items && search.items.length > 0 && (
                <p className="pt-1 text-center text-[12px] text-ink-400">네이버 검색은 {search.multi ? '지역마다' : '한 번에'} 최대 5곳까지 보여줘요 · 더 많은 곳은 ‘더 보기’</p>
              )}
            </div>
          </>
        ) : (
          <>
            <div className="flex items-baseline justify-between px-5 pb-2">
              <h2 className="text-[15px] font-extrabold text-ink-900">
                우리가 다녀온 곳 <span className="text-coral-500">{visible.length}</span>
                {visible.length !== cafes.length && <span className="font-semibold text-ink-400"> / {cafes.length}</span>}
              </h2>
              <button onClick={() => setMapOpen((v) => !v)} className="text-[12px] font-bold text-ink-500">{mapOpen ? '지도 접기 ▴' : '지도 펼치기 ▾'}</button>
            </div>
            <div className="flex-1 space-y-3 overflow-y-auto no-scrollbar px-4 pb-32">
              {visible.map((c) => <CafeCard key={c.id} cafe={c} active={c.id === selectedId} onClick={() => onCardClick(c.id)} />)}
              {visible.length === 0 && (
                <div className="mt-8 flex flex-col items-center text-center text-ink-500">
                  <Bichon className="h-16 w-16" />
                  <p className="mt-3 font-bold text-ink-700">{cafes.length ? '조건에 맞는 곳이 아직 없어요' : '아직 다녀온 곳이 없어요'}</p>
                  <p className="text-sm">위 검색창에서 ‘{regionName ? `${regionName} ` : ''}애견동반 카페’처럼 찾아서 기록해 보세요</p>
                </div>
              )}
              {visible.length > 0 && <p className="pt-2 text-center text-[12px] text-ink-400">카드를 한 번 더 누르면 상세 정보가 열려요</p>}
            </div>
          </>
        )}
      </section>

      {/* 추가 버튼 */}
      {!inSearch && (
        <button onClick={() => { vibrate(); setEditing({ mode: 'new' }); }}
          className="fixed bottom-safe left-1/2 z-30 flex -translate-x-1/2 items-center gap-2 rounded-full bg-coral-500 px-6 py-4 text-[15px] font-extrabold text-white shadow-xl shadow-coral-500/40 active:scale-95">
          <span className="text-xl leading-none">＋</span> 방문 기록
        </button>
      )}

      {toast && (
        <div className="fixed left-1/2 top-[calc(env(safe-area-inset-top)+12px)] z-[1200] w-max max-w-[90vw] -translate-x-1/2 rounded-2xl bg-ink-900/90 px-4 py-2.5 text-center text-sm font-semibold text-white shadow-lg fade-in">{toast}</div>
      )}

      {detail && <DetailSheet cafe={detail} onClose={() => setDetailId(null)} onDelete={remove} onEdit={() => { setEditing(detail); setDetailId(null); }} />}
      {editing && (
        <AddCafeSheet engine={engine} center={center} searchEnabled={config.searchEnabled}
          initial={editing.mode === 'new' ? null : editing} prefill={editing.mode === 'new' ? editing.prefill : null}
          onClose={() => setEditing(null)} onSave={save} />
      )}
      {showMapHelp && (
        <MapHelpSheet engine={engine} note={mapNote} config={config} pref={mapPref} onClose={() => setShowMapHelp(false)}
          onPref={(p) => { try { localStorage.setItem(MAP_PREF_KEY, p); } catch (e) {} location.reload(); }} />
      )}
      {showRegion && (
        <RegionSheet current={regions} firstRun={!regions} onDone={chooseRegions} onClose={() => setShowRegion(false)} />
      )}
      {showInstall && !showRegion && (
        <InstallGuide deferredPrompt={deferredPrompt} onInstalled={() => setShowInstall(false)}
          onClose={() => { setShowInstall(false); try { localStorage.setItem('install-dismissed', '1'); } catch (e) {} }} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// 서비스 워커 등록 (https 또는 localhost에서만 동작)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const reg = () => navigator.serviceWorker.register('./sw.js').catch(() => {});
  document.readyState === 'complete' ? reg() : window.addEventListener('load', reg);
}
  </script>
</body>
</html>
